<text x="40" y="82" class="title" >教学 Harness · 围绕同一个工具循环增加机制</text>
<text x="40" y="118" class="body" >基于 learn-claude-code s01–s17；这是第三方机制教学，不是官方 Claude Code 源码。</text>
<text x="40" y="151" class="small" >实线：调用或数据返回    虚线：装配或机制挂载    各图是逻辑结构，不代表性能排名</text>
