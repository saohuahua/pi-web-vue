<text x="60" y="1080" class="body" >组合取舍：更换 provider 仍需满足契约；文件系统与子进程应处于一致的执行环境。</text>
<text x="60" y="1122" class="body" >接入取舍：SDK 关闭运行时会影响该子进程；不能直接等同于只取消一条消息。</text>
