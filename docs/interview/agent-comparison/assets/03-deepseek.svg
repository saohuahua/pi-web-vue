<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1210" viewBox="0 0 1440 1210" role="img" aria-labelledby="title desc"><title id="title">DeepSeek Harness · 由插件树组成运行时</title><desc id="desc">Cordis 管注册与生命周期；profile 决定组合；日志与实时流承担不同职责。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#285caa"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#167668"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7753a2"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65758a"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9c6526"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#223249}.title{font-size:32px;font-weight:700}.group{font-size:23px;font-weight:700}.node{font-size:21px;font-weight:600}.body{font-size:17px}.small{font-size:15px;fill:#53647b}.eyebrow{font-size:15px;letter-spacing:2px;fill:#65758a}</style><rect width="1440" height="1210" fill="#fafbfd"/><text x="40" y="34" class="eyebrow" >PI WEB VUE  /  AGENT COMPARISON</text>
<text x="40" y="82" class="title" >DeepSeek Harness · 由插件树组成运行时</text>
<text x="40" y="118" class="body" >Cordis 管注册与生命周期；profile 决定组合；日志与实时流承担不同职责。</text>
<text x="40" y="151" class="small" >实线：调用或数据返回    虚线：装配或机制挂载    各图是逻辑结构，不代表性能排名</text>
