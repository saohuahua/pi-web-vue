<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1030" viewBox="0 0 1040 1030" role="img" aria-labelledby="title desc"><title id="title">一份会话记录，三个不同观察范围</title><desc id="desc">当前展示、累计消耗与模型输入各有用途 · 压缩后不应把它们当成同一份消息数组</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#15806b"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243248} .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52627a}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:15px;fill:#52627a}</style><rect width="1040" height="1030" fill="#f7f9fc"/>
<text x="40" y="49" class="title">一份会话记录，三个不同观察范围</text>
<text x="40" y="80" class="sub">当前展示、累计消耗与模型输入各有用途 · 压缩后不应把它们当成同一份消息数组</text>
<rect x="40" y="120" width="960" height="130" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="58" y="150" class="label">持久会话记录：header + entries</text>
<text x="58" y="179" class="body">消息 / 模型变化 / 名称 / 压缩等记录</text>
<text x="58" y="204" class="body">示例：e1 → e2 后分出 e3 与 e4，当前叶节点为 e4</text>
<text x="58" y="229" class="body">记录 ID 与 parentId 保存关系；文件顺序不等于当前对话顺序</text>
<path d="M520 250 L520 290 L190 290 L190 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 250 L520 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 290 L850 290 L850 340" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="40" y="340" width="300" height="185" rx="10" fill="#eef4ff" stroke="#cbd5e1"/>
<text x="58" y="370" class="label">① 当前历史链</text>
<text x="58" y="399" class="body">从 leaf=e4 开始</text>
<text x="58" y="424" class="body">沿 parentId 回溯</text>
<text x="58" y="449" class="body">reverse 得到顺序</text>
<text x="58" y="474" class="body">结果：e1 → e2 → e4</text>
<rect x="370" y="340" width="300" height="185" rx="10" fill="#fff6e8" stroke="#cbd5e1"/>
<text x="388" y="370" class="label">② 完整记录累计</text>
<text x="388" y="399" class="body">遍历完整 entries</text>
<text x="388" y="424" class="body">累加消息与压缩 usage</text>
<text x="388" y="449" class="body">包含非当前分支消耗</text>
<text x="388" y="474" class="body">缺失 usage 不自动补算</text>
<rect x="700" y="340" width="300" height="185" rx="10" fill="#edf8f4" stroke="#cbd5e1"/>
<text x="718" y="370" class="label">③ SDK 运行上下文</text>
<text x="718" y="399" class="body">SDK 组织模型输入</text>
<text x="718" y="424" class="body">结合历史与压缩状态</text>
<text x="718" y="449" class="body">可能使用摘要与近期内容</text>
<text x="718" y="474" class="body">不等于网页完整历史</text>
<path d="M190 525 L190 575" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 525 L520 575" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M850 525 L850 575" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="40" y="575" width="300" height="145" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="58" y="605" class="label">页面消息列表</text>
<text x="58" y="634" class="body">messages 与 entryIds</text>
<text x="58" y="659" class="body">工具字段归一化</text>
<text x="58" y="684" class="body">用于阅读和定位记录</text>
<rect x="370" y="575" width="300" height="145" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="388" y="605" class="label">累计 stats</text>
<text x="388" y="634" class="body">消息数 / 工具数</text>
<text x="388" y="659" class="body">input / output / cache</text>
<text x="388" y="684" class="body">记录中的费用</text>
<rect x="700" y="575" width="300" height="145" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="718" y="605" class="label">contextUsage</text>
<text x="718" y="634" class="body">SDK 查询当前占用</text>
<text x="718" y="659" class="body">与模型窗口比较</text>
<text x="718" y="684" class="body">用于理解后续输入规模</text>
<rect x="40" y="790" width="960" height="170" rx="10" fill="#eef4ff" stroke="#cbd5e1"/>
<text x="58" y="820" class="label">压缩后，这三种现象可以同时成立</text>
<text x="58" y="849" class="body">用户仍能查看早期历史；模型后续输入已经重新组织；累计费用仍保留</text>
<text x="58" y="874" class="body">列表摘要采用有界读取，不代表打开长会话已经分页</text>
<text x="58" y="899" class="body">底层有历史树，不代表 Web 前端已完成分支导航</text>
</svg>
