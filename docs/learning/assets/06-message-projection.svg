<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1070" viewBox="0 0 1040 1070" role="img" aria-labelledby="title desc"><title id="title">从事件到界面：三种状态各有归属</title><desc id="desc">内容生成、工具执行和结果配对分别处理，再组合成用户看到的过程</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#15806b"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243248} .title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52627a}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:15px;fill:#52627a}</style><rect width="1040" height="1070" fill="#f7f9fc"/><text x="40" y="49" class="title">从事件到界面：三种状态各有归属</text><text x="40" y="80" class="sub">内容生成、工具执行和结果配对分别处理，再组合成用户看到的过程</text>
<rect x="40" y="120" width="960" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="58" y="150" class="label">入口：EventSource → 连接身份检查 → chat.applyEvent</text>
<text x="58" y="178" class="body">先判断事件属于谁，再决定更新哪份状态</text>
<rect x="40" y="260" width="300" height="125" rx="10" fill="#eef4ff" stroke="#cbd5e1"/>
<text x="58" y="290" class="label">① 消息内容事件</text>
<text x="58" y="318" class="body">message_start / update</text>
<text x="58" y="343" class="body">message_end</text>
<rect x="370" y="260" width="300" height="125" rx="10" fill="#edf8f4" stroke="#cbd5e1"/>
<text x="388" y="290" class="label">② 工具执行事件</text>
<text x="388" y="318" class="body">tool_execution_start</text>
<text x="388" y="343" class="body">tool_execution_update</text><text x="388" y="368" class="body">tool_execution_end</text>
<rect x="700" y="260" width="300" height="125" rx="10" fill="#fff6e8" stroke="#cbd5e1"/>
<text x="718" y="290" class="label">③ 工具结果消息</text>
<text x="718" y="318" class="body">role: toolResult</text>
<text x="718" y="343" class="body">toolCallId: call-1</text>
<path d="M190 205 L190 260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 205 L520 260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M850 205 L850 260" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="40" y="435" width="300" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="58" y="465" class="label">store + streamReducer</text>
<text x="58" y="493" class="body">snapshot 初始化助手消息</text>
<text x="58" y="518" class="body">contentIndex 定位内容块</text>
<text x="58" y="543" class="body">delta 追加 / text_end 用全文</text>
<rect x="370" y="435" width="300" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="388" y="465" class="label">activeTools</text>
<text x="388" y="493" class="body">调用 ID → 名称与进度</text>
<text x="388" y="518" class="body">执行开始加入</text>
<text x="388" y="543" class="body">执行结束移除</text>
<rect x="700" y="435" width="300" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="718" y="465" class="label">messages + 结果索引</text>
<text x="718" y="493" class="body">保存完整工具结果</text>
<text x="718" y="518" class="body">toolResultsByCallId</text>
<text x="718" y="543" class="body">按调用 ID 查找</text>
<path d="M190 385 L190 435" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M520 385 L520 435" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M850 385 L850 435" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="40" y="640" width="300" height="140" rx="10" fill="#eef4ff" stroke="#cbd5e1"/>
<text x="58" y="670" class="label">MessageItem</text>
<text x="58" y="698" class="body">正文 → Markdown</text>
<text x="58" y="723" class="body">思考 → ThinkingBlock</text>
<text x="58" y="748" class="body">调用 → ToolCallCard</text>
<rect x="370" y="640" width="300" height="140" rx="10" fill="#edf8f4" stroke="#cbd5e1"/>
<text x="388" y="670" class="label">运行状态条</text>
<text x="388" y="698" class="body">此刻正在执行什么</text>
<text x="388" y="723" class="body">暂无正文时仍显示过程</text>
<rect x="700" y="640" width="300" height="140" rx="10" fill="#fff6e8" stroke="#cbd5e1"/>
<text x="718" y="670" class="label">ToolCallCard 的结果</text>
<text x="718" y="698" class="body">调用块提供参数</text>
<text x="718" y="723" class="body">结果消息提供执行输出</text>
<text x="718" y="748" class="body">call-1 将二者关联</text>
<path d="M190 580 L190 640" fill="none" stroke="#15806b" stroke-width="2" marker-end="url(#green)"/>
<path d="M520 580 L520 640" fill="none" stroke="#15806b" stroke-width="2" marker-end="url(#green)"/>
<path d="M850 580 L850 640" fill="none" stroke="#15806b" stroke-width="2" marker-end="url(#green)"/>
<text x="40" y="1030" class="small">单条消息结束后仍可能执行工具 · 整体 isRunning 由任务生命周期单独管理</text>
<path d="M190 780 L190 850 L520 850 L520 895 M850 780 L850 850 L520 850" stroke="#15806b" stroke-width="2" fill="none" marker-end="url(#green)"/>

<rect x="170" y="895" width="700" height="100" rx="10" fill="#edf8f4" stroke="#cbd5e1"/>
<text x="188" y="925" class="label">最终工具卡片：用户看到同一次工具操作的完整过程</text>
<text x="188" y="954" class="body">rawInput / input 展示参数，activeTools 参与执行态，result 提供输出与错误</text>
<text x="188" y="979" class="small">助手消息已定稿但工具仍执行时，不能只看消息的 streaming 标记</text>
<path d="M670 510 L685 510 L685 870 L540 870 L540 895" fill="none" stroke="#15806b" stroke-width="2" marker-end="url(#green)"/></svg>